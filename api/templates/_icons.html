{% macro shield() -%}
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="M12 2.5L4.5 5.5V11c0 5.2 3.2 9.2 7.5 10.8 4.3-1.6 7.5-5.6 7.5-10.8V5.5L12 2.5z"
    stroke="var(--sn-primary)" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
  <path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="var(--sn-primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{%- endmacro %}

{% macro check() -%}
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="vertical-align:-4px; margin-right:.3rem;" aria-hidden="true">
  <circle cx="12" cy="12" r="10" fill="var(--sn-good)"/>
  <path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
{%- endmacro %}

{% macro warn() -%}
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="vertical-align:-4px; margin-right:.3rem;" aria-hidden="true">
  <path d="M12 3.2L22 20.5H2L12 3.2z" fill="var(--sn-accent)"/>
  <rect x="11" y="9" width="2" height="6" rx="1" fill="#fff"/>
  <rect x="11" y="16.3" width="2" height="2" rx="1" fill="#fff"/>
</svg>
{%- endmacro %}

{% macro dot(color) -%}
<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:{{ color }}; margin-right:.4rem;"></span>
{%- endmacro %}
