# Project Sentinel — Tuần 2 Agent IAM (Kong DB-less)
# Nguyên tắc: identity (apikey) ≠ capability (ACL + path policy). Fail closed.
#
# Consumers:
#   recon-agent   (recon-key-demo)   → group get-only  → chỉ GET đọc
#   exploit-agent (exploit-key-demo) → group exploit   → GET + POST (+ rate-limit)
#
# Path deny: mọi request bắt đầu /rest/admin → 403 (pre-function, hard control)

_format_version: "3.0"
_transform: true

services:
  # --- READ: GET/HEAD/OPTIONS trên /api và /rest ---
  - name: juice-shop-read
    url: http://juice-shop:3000
    routes:
      - name: read-api
        paths:
          - /api
        methods:
          - GET
          - HEAD
          - OPTIONS
        strip_path: false
      - name: read-rest
        paths:
          - /rest
        methods:
          - GET
          - HEAD
          - OPTIONS
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true
      - name: acl
        config:
          allow:
            - get-only
            - exploit
          hide_groups_header: true
      - name: pre-function
        config:
          access:
            - |
              local path = kong.request.get_path()
              if string.sub(path, 1, 11) == "/rest/admin" then
                return kong.response.exit(403, {
                  error = "forbidden",
                  reason = "path_denied",
                  path = "/rest/admin"
                })
              end

  # --- WRITE: POST/PUT/PATCH/DELETE — chỉ exploit + rate-limit ---
  - name: juice-shop-write
    url: http://juice-shop:3000
    routes:
      - name: write-api
        paths:
          - /api
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
        strip_path: false
      - name: write-rest
        paths:
          - /rest
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true
      - name: acl
        config:
          allow:
            - exploit
          hide_groups_header: true
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          fault_tolerant: true
      - name: pre-function
        config:
          access:
            - |
              local path = kong.request.get_path()
              if string.sub(path, 1, 11) == "/rest/admin" then
                return kong.response.exit(403, {
                  error = "forbidden",
                  reason = "path_denied",
                  path = "/rest/admin"
                })
              end

consumers:
  - username: recon-agent
    keyauth_credentials:
      - key: recon-key-demo
    acls:
      - group: get-only

  - username: exploit-agent
    keyauth_credentials:
      - key: exploit-key-demo
    acls:
      - group: exploit
